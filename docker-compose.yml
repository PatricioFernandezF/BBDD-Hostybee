version: "3.8"

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb_db
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=Solito674
    volumes:
      - marialn_data:/var/lib/mysql
      - ./init-databases.sql:/docker-entrypoint-initdb.d/00-init-databases.sql
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pSolito674 | grep 'mysqld is alive'"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "3578:80"
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=root
      - PMA_PASSWORD=Solito674
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - coolify

volumes:
  marialn_data:

networks:
  coolify:
      external: true
      name: coolify