version: "3.8"

services:
  mariadb:
    image: mariadb:11
    container_name: mariadb_db
    ports:
      - "3307:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=Hostybee2025!Solito674
      - MARIADB_USER=hostybee_admin
      - MARIADB_PASSWORD=Hostybee2025!Solito674
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./newsletter.sql:/docker-entrypoint-initdb.d/01-newsletter.sql
      - ./uploads.sql:/docker-entrypoint-initdb.d/02-uploads.sql
    restart: unless-stopped
    networks:
      - coolify
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -pHostybee2025!Solito674 | grep 'mysqld is alive'"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    ports:
      - "3578:80"
    environment:
      - PMA_HOST=mariadb
      - PMA_USER=hostybee_admin
      - PMA_PASSWORD=Hostybee2025!Solito674
    depends_on:
      - mariadb
    restart: unless-stopped
    networks:
      - coolify

volumes:
  mariadb_data:

networks:
  coolify:
      external: true
      name: coolify